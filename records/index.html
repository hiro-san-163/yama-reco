---
layout: default
title: 山行記録
breadcrumb: 山行記録
---

<section class="records-page container">

  <header class="page-header">

    <h1>山行記録</h1>

    <p class="page-description">
      山行記録の一覧です。エリア・ジャンル・年で絞り込みできます。
    </p>

  </header>

  <section class="records-filter">

    <div class="form-group">

      <label for="areaFilter">
        エリア
      </label>

      <select id="areaFilter">
        <option value="">すべて</option>
      </select>

    </div>

    <div class="form-group">

      <label for="genreFilter">
        ジャンル
      </label>

      <select id="genreFilter">
        <option value="">すべて</option>
      </select>

    </div>

    <div class="form-group">

      <label for="yearFilter">
        年
      </label>

      <select id="yearFilter">
        <option value="">すべて</option>
      </select>

    </div>

    <div class="form-group">

      <label for="pageSize">
        表示件数
      </label>

      <select id="pageSize"></select>

    </div>

    <div class="form-group">

      <button id="searchButton" type="button">
        検索
      </button>

    </div>

  </section>

  <div class="records-count">

    <span id="recordsCount">
      0件
    </span>

  </div>

  <p
    id="recordEmptyMessage"
    class="record-empty-message"
    hidden>
    条件に一致する山行記録はありません。
  </p>

  <div id="recordsList" class="records-list"></div>

  <div id="pagination" class="pagination"></div>

</section>

<script>

{% assign records = site.posts %}

window.recordsData = [

{% for post in records %}

{
  title: {{ post.title | jsonify }},
  url: {{ post.url | relative_url | jsonify }},
  date_s: {{ post.date_s | jsonify }},
  area: {{ post.area | jsonify }},
  genre: {{ post.genre | jsonify }},
  summary: {{ post.sm2 | strip_html | strip_newlines | jsonify }},
  thumbnail: {{ post.tm | jsonify }},
  year: {{ post.date_s | slice: 0, 4 | jsonify }}
}

{% unless forloop.last %},{% endunless %}

{% endfor %}

];

</script>

<script src="{{ '/assets/js/pagination.js' | relative_url }}"></script>
<script src="{{ '/assets/js/records.js' | relative_url }}"></script>
