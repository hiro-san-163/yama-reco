<nav class="breadcrumb" aria-label="パンくずリスト">

  <a href="{{ '/' | relative_url }}">ホーム</a>

  {% if page.url contains '/records/' %}
    <span aria-hidden="true">/</span>
    <span>{{ page.title | default: '山行記録一覧' }}</span>
  {% elsif page.layout == 'record' %}
    <span aria-hidden="true">/</span>
    <a href="{{ '/records/' | relative_url }}">山行記録</a>
    <span aria-hidden="true">/</span>
    <span>{{ page.title }}</span>
  {% elsif page.title %}
    <span aria-hidden="true">/</span>
    <span>{{ page.title }}</span>
  {% endif %}

</nav>
