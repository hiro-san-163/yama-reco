<!-- ======================================
     SITE HEADER
     Branding + Global Navigation
====================================== -->

<header class="site-header">

  <div class="header-inner">

    <a
      href="{{ '/' | relative_url }}"
      class="site-brand"
      aria-label="{{ site.title }}">

      {% if site.logo %}

      <img
        src="{{ site.logo | relative_url }}"
        alt="{{ site.title }}"
        class="site-logo">

      {% endif %}

      <span class="site-title">

        {{ site.title }}

      </span>

    </a>

    <nav
      class="site-nav"
      aria-label="グローバルナビゲーション">

      <button
        class="nav-toggle"
        id="navToggle"
        type="button"
        aria-label="メニューを開く"
        aria-expanded="false"
        aria-controls="navMenu">

        ☰

      </button>

      <ul
        class="nav-menu"
        id="navMenu">

        <li>
          <a
            href="{{ '/' | relative_url }}"
            {% if page.url == "/" %}
            aria-current="page"
            {% endif %}>
            HOME
          </a>
        </li>

        <li>
          <a
            href="{{ '/records/' | relative_url }}"
            {% if page.url contains '/records' %}
            aria-current="page"
            {% endif %}>
            山行記録
          </a>
        </li>

        <li>
          <a
            href="{{ '/logs/' | relative_url }}"
            {% if page.url contains '/logs' %}
            aria-current="page"
            {% endif %}>
            山行検索
          </a>
        </li>

        <li>
          <a
            href="{{ '/about/' | relative_url }}"
            {% if page.url contains '/about' %}
            aria-current="page"
            {% endif %}>
            自己紹介
          </a>
        </li>

        <li>
          <a
            href="{{ '/blog/' | relative_url }}"
            {% if page.url contains '/blog' %}
            aria-current="page"
            {% endif %}>
            ブログ
          </a>
        </li>

        <li>
          <a
            href="{{ '/others/' | relative_url }}"
            {% if page.url contains '/others' %}
            aria-current="page"
            {% endif %}>
            その他
          </a>
        </li>

      </ul>

    </nav>

  </div>

  <div
    id="navOverlay"
    class="nav-overlay">

  </div>

</header>
