<!doctype html>
<html lang="{{ site.lang | default: 'ja' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
      {% if page.title %}
        {{ page.title }} | {{ site.title | default: 'hiro-san 山歩きサイト' }}
      {% else %}
        {{ site.title | default: 'hiro-san 山歩きサイト' }}
      {% endif %}
    </title>

    <meta
      name="description"
      content="{{ page.description | default: site.description | default: 'hiro-sanの山行記録サイト' }}">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>

  <body>
    {% include header.html %}

    {{ content }}

    {% include footer.html %}

    {% if page.custom_js %}
      <script src="{{ '/assets/js/' | append: page.custom_js | append: '.js' | relative_url }}"></script>
    {% endif %}
  </body>
</html>
