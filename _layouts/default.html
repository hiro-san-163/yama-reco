---

<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>

    {% if page.title %}

      {{ page.title }} | {{ site.title }}

    {% else %}

      {{ site.title }}

    {% endif %}

  </title>

  <meta
    name="description"
    content="{{ page.description | default: site.description }}">

  <link
    rel="icon"
    href="{{ '/assets/images/icons/favicon.ico' | relative_url }}"
    sizes="any">

  <link
    rel="apple-touch-icon"
    href="{{ '/assets/images/icons/apple-touch-icon.png' | relative_url }}">

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="{{ '/assets/images/icons/android-chrome-192x192.png' | relative_url }}">

  <link
    rel="stylesheet"
    href="{{ '/assets/css/style.css' | relative_url }}">

</head>

<body id="top">

  {% include header.html %}

    <main class="site-main">

    {{ content }}

  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/navigation.js' | relative_url }}"></script>

</body>

</html>
