---
layout: default
---

<article class="post">

  <header class="post-header">
    <h1>{{ page.title }}</h1>

    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%Y年%-m月%-d日" }}
      </time>

      {% if page.tags %}
      <div class="post-tags">
        {% for tag in page.tags %}
          <span class="tag">{{ tag }}</span>
        {% endfor %}
      </div>
      {% endif %}
    </div>
  </header>

  <section class="post-content">
    {{ content }}
  </section>

</article>
