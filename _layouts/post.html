---
layout: default
---

<article class="post">

  <header class="post-header">

    <h1 class="post-title">
      {{ page.title }}
    </h1>

    <div class="post-meta">

      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%Y年%-m月%-d日" }}
      </time>

      {% if page.tags %}
      <ul class="post-tags">
        {% for tag in page.tags %}
        <li class="tag">
          {{ tag }}
        </li>
        {% endfor %}
      </ul>
      {% endif %}

    </div>

  </header>

  <section class="post-content">

    {{ content }}

  </section>

</article>
